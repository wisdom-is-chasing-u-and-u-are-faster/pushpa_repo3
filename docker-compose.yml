version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sports_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sports_management
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: sports_mgmt_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
